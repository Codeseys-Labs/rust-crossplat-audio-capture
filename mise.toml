# mise.toml — per-project dev tools + task runner for rsac (rsac-7e19).
#
# Scope (deliberate):
#   - Runtime pins (bun/node/go/python) live in .tool-versions — the one
#     format that BOTH mise AND CI (oven-sh/setup-bun, actions/setup-node,
#     actions/setup-go, actions/setup-python via `*-version-file:
#     .tool-versions`) read, so local and CI versions cannot drift. Bump a
#     runtime there, not here.
#   - This file holds the mise-only dev tools (betterleaks, lefthook) and the
#     cross-platform tasks.
#   - Rust is NOT managed here — rust-toolchain.toml + rustup stay the single
#     source of truth for the Rust toolchain (CI pins via
#     dtolnay/rust-toolchain; the MSRV job depends on rustup override
#     semantics).
#
# Onboarding:   mise install && mise run setup
# Daily driver: mise run gate   (before pushing; lefthook also runs it on pre-push)
#
# CI uses mise only for betterleaks (jdx/mise-action, `install_args:
# betterleaks`) so the secret-scanner version below is the single pin.

[tools]
betterleaks = "1.10.1"
lefthook = "1"

[env]
RUST_BACKTRACE = "1"

[tasks.setup]
description = "One-shot onboarding after `mise install`: install the git hooks"
run = "lefthook install"

[tasks.gate]
description = "CI lint-job replica: fmt + clippy -D warnings + bare-build smoke + cargo doc (docsrs)"
run = "bash scripts/gate.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/gate.ps1"

[tasks."gate:full"]
description = "gate + lib tests + doctests + module-DAG guard"
run = "bash scripts/gate.sh --full"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/gate.ps1 --full"

[tasks.test]
description = "CI test-job replica for the host OS (lib tests + doctests)"
run = "bash scripts/gate.sh --tests-only"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/gate.ps1 --tests-only"

[tasks."gate:bindings"]
description = "check-bindings CI job replica: rsac-ffi/napi/python check+clippy+test, header drift, napi + python runtime smokes (each leg skips gracefully if its toolchain is missing; pass -- --strict to hard-fail on a missing toolchain instead)"
run = "bash scripts/gate-bindings.sh"

[tasks."gate:linux"]
description = "feat_linux lint-leg replica via the devcontainer image (docker run); skips gracefully without Docker (pass --rebuild to force a fresh image build)"
run = "bash scripts/gate-linux.sh"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks."test:audio"]
description = "ci_audio integration suite on this machine, all 3 capture tiers (extra args pass through, e.g. `mise run test:audio -- --tier system`)"
run = """bash -c 'case "$(uname -s)" in Darwin) exec bash scripts/test-audio-macos.sh "$@" ;; *) exec bash scripts/test-audio-linux.sh "$@" ;; esac' --"""
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-audio-windows.ps1"

[tasks."release:bump"]
description = "Bump the seven lockstep manifests + rotate CHANGELOG: mise run release:bump -- X.Y.Z [--dry-run]"
run = "bash scripts/bump-version.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-bash.ps1 scripts/bump-version.sh"

[tasks."release:tag"]
description = "Check release readiness and push the annotated tags: mise run release:tag -- X.Y.Z [--dry-run]"
run = "bash scripts/tag-release.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-bash.ps1 scripts/tag-release.sh"

[tasks."release:check-published"]
description = "Check whether a failed release version can be reused: mise run release:check-published -- X.Y.Z"
run = "bash scripts/check-release-published.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-bash.ps1 scripts/check-release-published.sh"

[tasks."release:verify-docs"]
description = "Post-publish docs.rs rendering spot-check: mise run release:verify-docs [-- X.Y.Z]"
run = "bash scripts/verify-docs-rs.sh"
run_windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-bash.ps1 scripts/verify-docs-rs.sh"

# Hook bodies (called from lefthook.yml). Windows routes through
# scripts/run-bash.ps1 (Git bash by absolute path), never a bare `bash` that
# can resolve to WSL's System32\bash.exe.
[tasks."hook:commit-msg"]
description = "commit-msg hook body (AGENTS.md §6): mise run hook:commit-msg -- <msg-file>"
hide = true
run = "bash scripts/hooks/commit-msg.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-bash.ps1 scripts/hooks/commit-msg.sh"

# betterleaks v1 does not auto-load .betterleaks.toml, so --config is explicit.
# --trust-local-git-config: betterleaks' default git-config isolation fails on
# Windows Git ("fatal: error reading /dev/null") and aborts the whole scan;
# these tasks only ever scan the developer's own checkout.
[tasks."secrets:staged"]
description = "betterleaks: scan the staged diff (lefthook pre-commit)"
run = "betterleaks git . --pre-commit --staged --trust-local-git-config --config .betterleaks.toml --redact --no-banner"

[tasks.secrets]
description = "betterleaks: scan the full git history (same scan the CI `secrets` job runs on pushes)"
run = "betterleaks git . --trust-local-git-config --config .betterleaks.toml --redact --no-banner"

[tasks."check:cross"]
description = "cross-rs Linux matrix (x64, ARM64, all-features); needs Docker + `cross`"
run = "bash scripts/cross-compile-check.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-bash.ps1 scripts/cross-compile-check.sh"
