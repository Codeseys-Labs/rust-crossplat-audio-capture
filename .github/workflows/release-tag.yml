# Release tagging follows the reviewed, squash-merged PR opened by
# release-prepare.yml. The script checks versions, existing tags and evidence
# before atomically pushing the crate and Go module tags.
#
# Tags pushed with GITHUB_TOKEN do not start tag-triggered workflows. Registry
# publishing (issue #88) needs its own start.
name: Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (X.Y.Z)
        type: string
        required: true
      sha:
        description: Merged commit SHA (40 lower-case hexadecimal characters)
        type: string
        required: true
      waive:
        description: Optional space-separated key=issue-number waivers
        type: string
        required: false
        default: ''
      dry_run:
        description: Check the release without creating tags
        type: boolean
        default: false

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release commit
    if: github.repository == 'Codeseys-Labs/rust-crossplat-audio-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - name: Validate dispatch
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          WAIVE: ${{ inputs.waive }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 lower-case hex characters"; exit 1; }
          [[ "$DISPATCH_REF" == refs/heads/master ]] || { echo "::error::dispatch on master"; exit 1; }
          [[ "$WAIVE" != *$'\n'* && "$WAIVE" != *$'\r'* ]] || { echo "::error::waivers must be space-separated"; exit 1; }
          read -r -a waivers <<< "$WAIVE"
          for waiver in "${waivers[@]}"; do
            [[ "$waiver" =~ ^(android-emu|ios-sim|windows-switch)=#?[0-9]+$ ]] || {
              echo "::error::invalid waiver: $waiver"; exit 1;
            }
          done

      # Unlike read-only workflows, credentials must persist: the gate script
      # fetches the branch and pushes both tags to origin.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify checkout and set bot identity
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]] || { echo "::error::checkout SHA mismatch"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The checkout's rust-toolchain.toml selects the pinned channel for cargo.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Gate and tag release
        id: tag
        shell: bash
        timeout-minutes: 15
        env:
          VERSION: ${{ inputs.version }}
          WAIVE: ${{ inputs.waive }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=("$VERSION")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          read -r -a waivers <<< "$WAIVE"
          for waiver in "${waivers[@]}"; do args+=(--waive "$waiver"); done
          bash scripts/tag-release.sh "${args[@]}"

      # A failed API request can leave the Release created despite its response.
      # Recheck before each attempt; if all attempts fail, the gated tags remain
      # and a maintainer must create the Release manually as the summary directs.
      - name: Create GitHub Release
        id: release
        if: ${{ !inputs.dry_run }}
        shell: bash
        timeout-minutes: 5
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::missing changelog section"; exit 1; }
          printf '\n' >> release-notes.md
          git for-each-ref --format='%(contents)' "refs/tags/v$VERSION" |
            grep -E '^(Evidence|Waived): ' >> release-notes.md
          for attempt in 1 2 3; do
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "GitHub Release v$VERSION already exists."
              exit 0
            fi
            if gh release create "v$VERSION" --verify-tag --title "rsac $VERSION" --notes-file release-notes.md; then
              exit 0
            fi
            if (( attempt < 3 )); then sleep 5; fi
          done
          echo "::error::could not confirm or create GitHub Release v$VERSION"
          exit 1

      - name: Summarize manual Release recovery
        if: ${{ failure() && !inputs.dry_run && steps.tag.outcome == 'success' && steps.release.outcome == 'failure' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## GitHub Release requires manual recovery"
            echo "The gated tags were pushed. Check whether the Release already exists; if not, create it by hand."
            echo "Prepare release-notes.md from this version's CHANGELOG section followed by the tag's Evidence: and Waived: lines, then run:"
            echo '```sh'
            printf 'gh release create "v%s" --verify-tag --title "rsac %s" --notes-file release-notes.md\n' "$VERSION" "$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            echo "Release v$VERSION at $SHA passed the dry run; no tags or release were created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release v$VERSION at $SHA was tagged and published on GitHub. Registry publishing needs its own start (issue #88)." >> "$GITHUB_STEP_SUMMARY"
          fi
