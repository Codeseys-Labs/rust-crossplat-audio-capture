# Unified CI for rsac (Rust Cross-Platform Audio Capture)
# Lint → Unit tests (Linux/Windows/macOS) → ARM64 cross-compile check

name: CI

on:
  # Manual dispatch is the ONLY way to run this matrix on a branch (cost
  # control): there is no `pull_request` trigger and no branch `push` trigger.
  # Run it from the Actions tab, or:
  #   gh workflow run ci.yml --ref <branch>               # diff-scoped (see `changes`)
  #   gh workflow run ci.yml --ref <branch> -f full=true  # whole matrix (semver gate: add -f semver=true)
  # Check runs attach to the dispatched commit, so they still show on that
  # commit's open PR. The only automatic PR check is changelog-guard.yml.
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Run the whole matrix (mobile legs and advisory coverage included)
          regardless of which paths the branch changed. Does not include the
          release semver gate; see `semver`. Default: scope the run by the
          branch's diff against the default branch.
        type: boolean
        default: false
      semver:
        description: >-
          Also run the release semver gate (cargo-semver-checks against the
          previous stable tag). Always on for release/vX.Y.Z branches.
        type: boolean
        default: false
  push:
    # Stable semver tags still fire automatically so the version-lockstep job's
    # tag-time hard gate (all manifests equal the tag) runs at the point of no
    # return. Pre-release shapes (v*-rc.1) are excluded. A `push` filter with
    # only `tags:` never matches a branch push.
    tags:
      - 'v*.*.*'
      - '!v*-*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least-privilege token: this workflow only builds/tests, never writes.
permissions:
  contents: read

# A newer manual dispatch on the same ref supersedes the older one; tag runs
# (the release gate) are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  # ── Diff-scoped manual runs (rsac-61ce) ──────────────────────────────
  # A manual dispatch on a branch classifies the files that branch changed
  # relative to the default branch (merge-base diff — the file set a PR from
  # the branch shows). `lint` runs only when code changed, and every other job
  # has `needs: lint`, so a docs-only branch skips the whole compile matrix.
  #
  # Fail-open by design: tag pushes (the version-lockstep tag-time hard gate
  # must always fire), a dispatch on the default branch, `full: true`, and
  # anything that cannot be classified all run the full matrix.
  #
  # `mobile` gates the heavy Gradle AAR + Xcode SwiftPM legs (mobile-android,
  # mobile-ios): they run only when the diff touches mobile-relevant paths.
  # Those paths include the shared layers (src/core, src/bridge, src/api), so
  # a shared-layer change that breaks a mobile cfg still surfaces.
  changes:
    name: Classify changed paths
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          run_full() {
            out "code=true"
            out "mobile=true"
            echo "$1 — running the full matrix"
            exit 0
          }
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            run_full "not a manual dispatch (${GITHUB_EVENT_NAME})"
          fi
          if [ "${FULL}" = "true" ]; then
            run_full "full=true requested"
          fi
          if [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            run_full "dispatched on the default branch"
          fi
          # Merge-base diff against the default branch. The compare API lists at
          # most 300 files, so a list at the cap may be truncated: fail open.
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${GITHUB_SHA}" -q '.files[].filename') || FILES=""
          if [ -z "$FILES" ] || [ "$(printf '%s\n' "$FILES" | wc -l)" -ge 300 ]; then
            run_full "could not classify changed files (API error, or an empty or truncated diff)"
          fi
          printf 'changed files:\n%s\n' "$FILES"
          NON_DOCS=$(printf '%s\n' "$FILES" \
            | grep -vE '^(docs/|\.seeds/|\.kilo/|\.mulch/|LICENSE)' \
            | grep -vE '\.md$' || true)
          if [ -z "$NON_DOCS" ]; then
            out "code=false"
            out "mobile=false"
            echo "docs-only branch — skipping the compile matrix"
            exit 0
          fi
          out "code=true"
          printf 'code changes detected:\n%s\n' "$NON_DOCS"
          # Mobile-relevant paths: the two mobile backends, the mobile/ trees,
          # the C FFI and the Tauri plugin that wrap them, workspace-level
          # dependency/toolchain files, and this workflow's own plumbing.
          MOBILE=$(printf '%s\n' "$FILES" \
            | grep -E '^(src/audio/(android|ios)/|src/(api|bridge|core)/|src/lib\.rs$|mobile/|bindings/rsac-ffi/|integrations/tauri-plugin-rsac/|tests/(android|ios)_|Cargo\.(toml|lock)$|rust-toolchain\.toml$|build\.rs$|\.github/workflows/ci\.yml$|\.github/actions/)' || true)
          if [ -n "$MOBILE" ]; then
            out "mobile=true"
            printf 'mobile changes detected:\n%s\n' "$MOBILE"
          else
            out "mobile=false"
            echo "no mobile-relevant changes — skipping the mobile legs"
          fi

  # ── Lint (clippy matrix across all 3 OS) ────────────────────────────
  lint:
    name: Lint & Format (${{ matrix.feature }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            feature: feat_linux
            os: linux
          - runner: blacksmith-4vcpu-windows-2025
            feature: feat_windows
            os: windows
          - runner: blacksmith-6vcpu-macos-15
            feature: feat_macos
            os: macos
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy

      - name: Install PipeWire dev libraries
        if: matrix.os == 'linux'
        uses: ./.github/actions/pipewire-setup

      # rustfmt is platform-independent; run the check once on the Linux leg.
      - name: Check formatting
        if: matrix.os == 'linux'
        run: cargo fmt --all -- --check

      # rsac L14(a): clippy now lints --all-targets (lib + bins + examples +
      # tests + benches) for the active platform, so example/test/bench code is
      # held to the same -D warnings bar as the library and demo binaries —
      # previously they were exempt and could accumulate lint debt silently.
      # rsac-0a1f: `cli` gates the rsac/standardized_test bins + the
      # verify_audio/basic_capture/record_to_file examples via
      # required-features, so --all-targets WITHOUT it silently skips them
      # (src/main.rs would lose its -D warnings coverage). `compose` is
      # platform-independent; lint it on every leg too.
      - name: Run Clippy
        run: cargo clippy --all-targets --no-default-features --features ${{ matrix.feature }},compose,cli,hotplug-recovery -- -D warnings

      # FH-2: the bare `--no-default-features` build (NO platform feature) must
      # still compile. It broke on Windows (E0432) because a bin gated only on
      # target_os pulled in a feature-gated module. Run it on all three runners —
      # the failure only manifests where target_os is true but the feat_* is off.
      - name: Build with no default features (bare-build smoke)
        run: cargo build --no-default-features

  # ── Linux unit tests ────────────────────────────────────────────────
  test-linux:
    name: Linux Unit Tests
    timeout-minutes: 25
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Install PipeWire dev libraries
        uses: ./.github/actions/pipewire-setup

      - name: Cargo check
        run: cargo check --lib --no-default-features --features feat_linux

      # Build every target (bin/ + examples/), not just the lib, so demo
      # binaries and examples are compiled and kept from bit-rotting.
      # rsac-0a1f: `cli` (rsac/standardized_test bins + several examples) and
      # `compose` (composed_capture example) gate targets via required-features
      # — without them --all-targets silently skips those targets.
      - name: Build all targets
        run: cargo build --all-targets --no-default-features --features feat_linux,compose,cli,hotplug-recovery

      # rsac-0a1f: `compose` is platform-independent (mock/scripted sources),
      # so its unit tests run in the lib suite on every OS leg.
      - name: Cargo test (unit tests)
        run: cargo test --lib --no-default-features --features feat_linux,compose,hotplug-recovery

      # TC-01: ADR-0001's headline alloc-free producer guarantee is proved ONLY
      # by tests/rt_alloc.rs, which is an integration test and so was never run
      # by the `--lib` job above. Allocation behaviour can differ per target, so
      # it runs on every per-OS unit job. It installs a process-wide
      # #[global_allocator] (CountingAllocator) and must therefore be its OWN
      # test binary; we pin --test-threads=1 so the global counter is never
      # perturbed by a parallel test in the same process.
      - name: Cargo test (rt_alloc — ADR-0001 alloc-free proof)
        run: cargo test --test rt_alloc --no-default-features --features feat_linux -- --test-threads=1

      # TC-02: the enumeration honest-failure contract (tests/enumeration_matrix.rs)
      # is device-free / graceful-skip (it asserts non-empty-or-classified-error
      # and skips the hardware assertions on a headless runner), but it was dead
      # in CI because the matrix only ran `--lib`. Wire it in per-OS.
      - name: Cargo test (enumeration_matrix — honest-failure contract)
        run: cargo test --test enumeration_matrix --no-default-features --features feat_linux

  # ── Windows unit tests ──────────────────────────────────────────────
  test-windows:
    name: Windows Unit Tests
    timeout-minutes: 25
    needs: lint
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Cargo check
        run: cargo check --lib --no-default-features --features feat_windows

      # Build every target (bin/ + examples/), not just the lib.
      # rsac-0a1f: `cli` + `compose` gate bins/examples via required-features —
      # without them --all-targets silently skips those targets.
      # rsac-e93b: `async-stream` added — the Linux feature-powerset job
      # excludes feat_windows/feat_macos, so this leg is the only place
      # async-stream ever compiles against the WASAPI backend.
      - name: Build all targets
        run: cargo build --all-targets --no-default-features --features feat_windows,compose,cli,async-stream,hotplug-recovery

      # TC-07: the Windows unit step used to be continue-on-error on the WHOLE
      # `cargo test --lib` run, so the ~40 inline wasapi.rs tests + 21 thread.rs
      # tests + the device-free DeviceWatcher lifecycle tests could regress
      # without ever gating CI. We now PARTITION the suite exactly like
      # release.yml's verify job: the platform-independent + non-audio tests
      # HARD-FAIL here (a real Windows unit regression blocks CI), while ONLY the
      # device-touching subset (the create_audio_client_* tests in
      # src/audio/windows/thread.rs, which open a real WASAPI client) is excluded
      # via --skip and re-run as a tolerated step below. The filter substring
      # mirrors release.yml's device_test_filter — keep the two in lockstep and
      # as narrow as possible if device-dependent test names change.
      # The device-dependent unit tests open a real WASAPI client / default
      # endpoint / IMMNotificationClient, which need the Windows Audio service
      # (Audiosrv) + an audio endpoint. The Blacksmith Windows image has had the
      # service since the 2026-11-26 probe (AGENTS.md §6), but it ships no
      # audio device and this job installs none, so these tests cannot be
      # required to pass here. They are partitioned out of the
      # hard-fail step (via --skip) and re-run as a tolerated step. Everything
      # NOT in this list (parse_session_identifier, get_process_name_by_pid,
      # backend_context, data_flow_to_kind, application_session_info, …) is pure
      # logic and HARD-FAILS, so a real unit regression still gates CI.
      # DEVICE_SKIPS must stay in lockstep with release.yml's verify job.
      # rsac-0a1f: `compose` added so the platform-independent compose unit
      # tests run here too (same feature set in the tolerated step below, so
      # the lib is compiled once for both partitions).
      - name: Cargo test (unit tests, hard-fail)
        shell: bash
        run: |
          DEVICE_SKIPS="--skip enumerate --skip default_device --skip device_enumeration --skip device_id --skip device_supported_formats --skip audio_device_ --skip create_stream --skip find_device --skip watch_ --skip create_audio_client"
          cargo test --lib --no-default-features --features feat_windows,compose,hotplug-recovery -- --test-threads=1 $DEVICE_SKIPS

      # Device-dependent subset ONLY (the families --skip'd above). Tolerated
      # because this job has no audio device on the Blacksmith Windows runner; this step
      # runs ONLY those families, so it can never mask the hard-fail partition.
      # Mirrors release.yml's tolerated device step — keep the filters in sync.
      - name: Cargo test (device-dependent tests, tolerated)
        continue-on-error: true
        shell: bash
        run: |
          for f in enumerate default_device device_enumeration device_id device_supported_formats audio_device_ create_stream find_device watch_ create_audio_client; do
            cargo test --lib --no-default-features --features feat_windows,compose,hotplug-recovery -- --test-threads=1 "$f" || true
          done

      # TC-01: ADR-0001 alloc-free producer proof (process-wide allocator, own
      # binary, single-threaded). Device-free, so it HARD-FAILS like Linux —
      # an allocation regression on Windows now blocks CI.
      - name: Cargo test (rt_alloc — ADR-0001 alloc-free proof)
        shell: bash
        run: cargo test --test rt_alloc --no-default-features --features feat_windows -- --test-threads=1

      # TC-02: device-free enumeration honest-failure contract (graceful-skip).
      - name: Cargo test (enumeration_matrix — honest-failure contract)
        shell: bash
        run: cargo test --test enumeration_matrix --no-default-features --features feat_windows

      # Doctests were Linux-only (feature-combo-doctests job) — doc examples
      # visible only under cfg(windows) never compiled as doctests. Run the
      # doc suite on this leg's feature set too (device-free; no_run examples
      # only compile). rsac-e93b: `async-stream` included so its doc examples
      # compile against feat_windows (the powerset job is Linux-only).
      - name: Cargo test (doctests)
        shell: bash
        run: cargo test --doc --no-default-features --features feat_windows,compose,sink-wav,cli,async-stream,hotplug-recovery

      - name: Report audio service status
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Audio Service Status ==="
          Get-Service -Name "Audiosrv" -ErrorAction SilentlyContinue | Format-Table Status, Name, DisplayName
          Write-Host "=== Audio Devices ==="
          Get-WmiObject Win32_SoundDevice -ErrorAction SilentlyContinue | Format-Table Name, Status

  # ── macOS unit tests ────────────────────────────────────────────────
  test-macos:
    name: macOS Unit Tests
    timeout-minutes: 25
    needs: lint
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Grant audio permissions for CI
        run: |
          # Grant microphone/audio access to avoid TCC dialog blocking tests
          # This allows the test binary to access audio devices without UI prompts
          TCC_DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          if [ -f "$TCC_DB" ]; then
            sqlite3 "$TCC_DB" \
              "INSERT OR IGNORE INTO access VALUES('kTCCServiceMicrophone','com.apple.Terminal',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s))" 2>/dev/null || true
            sqlite3 "$TCC_DB" \
              "INSERT OR IGNORE INTO access VALUES('kTCCServiceMicrophone','com.apple.dt.CommandLineTools',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s))" 2>/dev/null || true
            echo "TCC permissions granted (or already present)"
          else
            echo "TCC database not found — skipping permission grants"
          fi

      - name: Report audio environment
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Audio Devices ==="
          system_profiler SPAudioDataType 2>/dev/null || echo "No audio profiler available"

      - name: Cargo check
        run: cargo check --lib --no-default-features --features feat_macos

      # Build every target (bin/ + examples/), not just the lib.
      # rsac-0a1f: `cli` + `compose` gate bins/examples via required-features —
      # without them --all-targets silently skips those targets.
      # rsac-e93b: `async-stream` added — the Linux feature-powerset job
      # excludes feat_windows/feat_macos, so this leg is the only place
      # async-stream ever compiles against the CoreAudio backend.
      - name: Build all targets
        run: cargo build --all-targets --no-default-features --features feat_macos,compose,cli,async-stream,hotplug-recovery

      # TC-03: src/audio/macos/tap.rs's only process-tap-creating test —
      # test_new_system_creates_tap (calls CoreAudioProcessTap::new_system ->
      # AudioHardwareCreateProcessTap, which can BLOCK 10+ min without a
      # kTCCServiceAudioCapture grant — unavailable on Blacksmith macOS) — is
      # already #[ignore]d, so the default unit run does not execute it. The
      # remaining tap.rs tests are pure or CoreAudio read-only (enumerate /
      # translate / class-probe) and do not create a process tap. The step-level
      # timeout-minutes: 5 is retained as a defensive backstop: it fails THIS step
      # fast if a future non-ignored test regresses into the TCC-block path,
      # rather than eating the job-level timeout-minutes: 25 budget.
      # rsac-0a1f: `compose` added so the platform-independent compose unit
      # tests run in this leg too.
      - name: Cargo test (unit tests)
        timeout-minutes: 5
        run: cargo test --lib --no-default-features --features feat_macos,compose,hotplug-recovery

      # rsac-86c7: macos-tcc-spi's 1 test (preflight_returns_a_status_without_panicking,
      # src/audio/macos/permission.rs) is target_os-gated like feat_macos itself, so it
      # can only ever run on this leg. It never panics regardless of TCC state
      # (see the test's own doc comment) — safe to hard-fail here. Filtered to
      # just that test: the step above already executes the rest of the macOS
      # lib suite, so rerunning all ~600 tests here would only add time and a
      # second exposure to the TCC-adjacent tap tests.
      - name: Cargo test (macos-tcc-spi unit test)
        timeout-minutes: 5
        run: cargo test --lib --no-default-features --features feat_macos,compose,macos-tcc-spi preflight_returns_a_status_without_panicking

      # TC-01: ADR-0001 alloc-free producer proof (process-wide allocator, own
      # binary, single-threaded). Device-free, so it HARD-FAILS like Linux.
      - name: Cargo test (rt_alloc — ADR-0001 alloc-free proof)
        timeout-minutes: 5
        run: cargo test --test rt_alloc --no-default-features --features feat_macos -- --test-threads=1

      # TC-02: device-free enumeration honest-failure contract (graceful-skip).
      - name: Cargo test (enumeration_matrix — honest-failure contract)
        timeout-minutes: 5
        run: cargo test --test enumeration_matrix --no-default-features --features feat_macos

      # Doctests were Linux-only (feature-combo-doctests job) — doc examples
      # visible only under cfg(macos) never compiled as doctests. Run the doc
      # suite on this leg's feature set too (device-free; no_run examples only
      # compile). rsac-e93b: `async-stream` included so its doc examples
      # compile against feat_macos (the powerset job is Linux-only).
      - name: Cargo test (doctests)
        timeout-minutes: 10
        run: cargo test --doc --no-default-features --features feat_macos,compose,sink-wav,cli,async-stream,hotplug-recovery

      # OPTION B (existence check): Blacksmith macOS runners lack TCC grants for
      # Process Tap capture (see macos-process job in ci-audio-tests.yml —
      # continue-on-error with "Process Tap expected to skip due to TCC in CI").
      # Rather than add a known-failing step, we assert the ignored tests exist
      # and are discoverable by the harness. This catches regressions where the
      # tests get deleted, renamed, or fail to compile — the common failure
      # modes that a wiring check meaningfully guards against.
      - name: Verify ApplicationByName + ApplicationByPID tests are wired up
        timeout-minutes: 5
        run: |
          cargo test --test ci_audio --no-default-features --features feat_macos \
            -- --list --ignored 2>&1 | tee ci-audio-ignored.log
          grep -q "application_by_name" ci-audio-ignored.log || {
            echo "FAIL: application_by_name tests not discovered in ignored test list"
            exit 1
          }
          grep -q "application_by_pid" ci-audio-ignored.log || {
            echo "FAIL: application_by_pid tests not discovered in ignored test list"
            exit 1
          }
          echo "OK: application_by_{name,pid} tests are wired up (ignored, not run in CI — TCC unavailable on Blacksmith macOS)"

      # Existence check for subscribe + process_tree coverage added in
      # loop-18 task #3. These are NOT #[ignore]d — they use require_audio!()
      # to skip at runtime — so we list the full (non-ignored) suite and
      # grep for the module names. Keeps the wiring-regression guard in
      # lockstep with the application_by_{name,pid} pattern above.
      - name: Verify subscribe + process_tree tests are wired up
        timeout-minutes: 5
        run: |
          cargo test --test ci_audio --no-default-features --features feat_macos \
            -- --list 2>&1 | tee ci-audio-all.log
          grep -q "subscribe" ci-audio-all.log || {
            echo "FAIL: subscribe tests not discovered in test list"
            exit 1
          }
          grep -q "process_tree" ci-audio-all.log || {
            echo "FAIL: process_tree tests not discovered in test list"
            exit 1
          }
          echo "OK: subscribe + process_tree tests are wired up"

  # ── Linux ARM64 cross-compilation check ─────────────────────────────
  cross-compile-linux-arm64:
    name: Linux ARM64 Cross-Compile Check
    timeout-minutes: 20
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-unknown-linux-gnu

      # Combined cross-gcc + host PipeWire install: kept inline (not the
      # pipewire-setup composite) because it also installs the aarch64 cross
      # toolchain the composite does not cover, and shares a single apt-get
      # update across both package sets.
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # PipeWire dev libraries for host (needed for build.rs)
          sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev pkg-config

      - name: Cross-compile check (lib only)
        run: |
          # ARM64 cross-check. We do NOT install :arm64 PipeWire dev packages:
          # the pipewire-debian PPA does not publish arm64 binaries, so apt
          # would fail. Instead we run `cargo check` (compile-only, no link)
          # and make its REAL exit code authoritative: exit 0 passes, and a
          # non-zero exit is tolerated ONLY for the one known-acceptable mode
          # — the pipewire/libspa -sys build scripts failing pkg-config
          # discovery of the (missing) aarch64 system libraries. Any other
          # failure — rustc `error[` / `error:` diagnostics, a non-PipeWire
          # build-script crash — fails the job. CARGO_TERM_COLOR is forced off
          # for this invocation so the greps below see plain text (the
          # workflow-level `always` would embed ANSI codes in the log).
          set -o pipefail
          echo "Checking ARM64 compilation (library code only, no linking)..."
          STATUS=0
          CARGO_TERM_COLOR=never cargo check --lib --no-default-features --features feat_linux \
            --target aarch64-unknown-linux-gnu 2>&1 | tee arm64-check.log || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "OK: ARM64 cross-check passed cleanly"
            exit 0
          fi
          # Fail on any error diagnostic that is NOT the tolerated
          # pipewire/libspa build-script failure.
          UNEXPECTED="$(grep -E '^error(\[|:)' arm64-check.log \
            | grep -vE 'failed to run custom build command for `(pipewire|libspa)' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "FAIL: cargo check exited ${STATUS} with unexpected errors for aarch64-unknown-linux-gnu:"
            echo "$UNEXPECTED"
            exit 1
          fi
          # Confirm the root cause really is pkg-config discovery of the
          # missing aarch64 PipeWire libs, not some other build-script issue.
          if ! grep -qiE 'pkg-config|library .* was not found|\.pc' arm64-check.log; then
            echo "FAIL: cargo check exited ${STATUS} without the expected pkg-config/libpipewire diagnostic — not the tolerated missing-arm64-libs mode"
            exit 1
          fi
          echo "TOLERATED: aarch64 PipeWire system libraries unavailable (pkg-config failure in the pipewire/libspa -sys build scripts); no rustc compilation errors"

  # ── Android mobile leg (rsac-1a6e): backend cross-check + AAR build ──
  # Stage-1 mobile CI per docs/MOBILE_BACKEND_DESIGN.md: proves COMPILATION,
  # not capture. `cargo check` needs no NDK (no linking); the Gradle step
  # builds mobile/android's rsac.aar sources for real. Emulator/device
  # runtime verification is a separate, later seed — do not claim "tested
  # on Android" off the back of this job.
  mobile-android:
    name: Android Mobile Leg (cross-check + AAR)
    timeout-minutes: 25
    needs: [changes, lint]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-linux-android

      - name: Cross-check the Android backend (feat_android)
        run: |
          cargo check --target aarch64-linux-android --no-default-features --features feat_android
          cargo check --target aarch64-linux-android
          cargo check --target aarch64-linux-android --tests --no-default-features --features feat_android
          cargo clippy --target aarch64-linux-android --no-default-features --features feat_android -- -D warnings

      # rsac-7a18: the C FFI is how Flutter/C consumers reach rsac on Android.
      - name: Cross-check rsac-ffi for Android (feat_android)
        run: cargo check -p rsac-ffi --target aarch64-linux-android --no-default-features --features feat_android

      # rsac-e6d3: the test-only playback driver cdylib is otherwise compiled
      # ONLY inside ci-android-emu.yml's KVM-gated step — without this check a
      # Rust error in its cfg(feat_android) driver module would be invisible
      # whenever KVM is absent (the emu leg skips). check-not-build is enough:
      # linking is proven by the emu leg's cargo-ndk build + llvm-nm assert.
      - name: Cross-check rsac-androidtest-native for Android (feat_android)
        run: cargo check -p rsac-androidtest-native --target aarch64-linux-android --no-default-features --features feat_android

      # rsac-f21c / ADR-0014 §7: the plugin's #[cfg(mobile)] mobile.rs
      # (register_android_plugin, run_mobile_plugin, AndroidProjectionToken
      # threading) is cross-checked here. On the android target the plugin's
      # rsac dep pulls feat_android so with_android_projection is in scope.
      # [CI-VERIFY] item #2.
      - name: Cross-check tauri-plugin-rsac for Android (#[cfg(mobile)])
        run: cargo check -p tauri-plugin-rsac --target aarch64-linux-android

      # rsac-0aa9: build librsac.so for real with the NDK linker — the first
      # step that actually LINKS the backend (#[link(name = "aaudio")]);
      # cargo check never does. Output lands in the AAR's jniLibs so the
      # Gradle build below packages it (System.loadLibrary("rsac") on the
      # Kotlin side resolves the JNI surface registered in JNI_OnLoad,
      # rsac-77f1).
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Build librsac.so into jniLibs (arm64-v8a + x86_64)
        run: |
          # ANDROID_NDK_LATEST_HOME / ANDROID_NDK_ROOT are runner-process env
          # (visible to the shell, NOT to the `env` expression context — first-run
          # lesson: mapping it via `env:` yielded an empty string and broke
          # cargo-ndk's NDK detection).
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "Using NDK at: $ANDROID_NDK_HOME"
          rustup target add x86_64-linux-android
          # --platform 29 matches the AAR's minSdk AND is required for the
          # link to resolve: libaaudio.so stubs exist in the NDK sysroot only
          # from API 26+ (cargo-ndk's default platform is lower — second
          # first-run lesson: ld.lld could not find -laaudio without this).
          cargo ndk -t arm64-v8a -t x86_64 --platform 29 -o mobile/android/src/main/jniLibs \
            build --release -p rsac-android-native
          ls -l mobile/android/src/main/jniLibs/*/librsac.so

      # rsac-77f1: the whole playback path hangs off System.loadLibrary
      # invoking JNI_OnLoad (RegisterNatives design — deliberately NO Java_*
      # name-resolved exports). Assert the symbol is really exported from
      # the cdylib: #[no_mangle] symbols originating in the rsac RLIB must
      # survive into the rsac-android-native CDYLIB's dynamic symbol table,
      # which is a linker property no cargo check can prove.
      - name: Verify JNI_OnLoad is an exported dynamic symbol
        run: |
          NM="$(find "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" -name llvm-nm -path '*linux-x86_64*' | head -n1)"
          for ABI in arm64-v8a x86_64; do
            SO="mobile/android/src/main/jniLibs/$ABI/librsac.so"
            "$NM" -D --defined-only "$SO" | grep -q " JNI_OnLoad$" || {
              echo "FAIL: $SO does not export JNI_OnLoad (RegisterNatives entry point)"
              "$NM" -D --defined-only "$SO" | head -n 40
              exit 1
            }
          done
          echo "OK: JNI_OnLoad exported for arm64-v8a and x86_64"

      - name: Select JDK 17 (AGP 8.x requirement)
        run: echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      - name: Install Android SDK platform for compileSdk 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.11.1"

      - name: Build rsac.aar (mobile/android glue sources)
        working-directory: mobile/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify the AAR artifact contains the native library
        run: |
          AAR="$(find mobile/android/build/outputs/aar -name '*.aar' | head -n1)"
          if [ -z "$AAR" ]; then
            echo "FAIL: no .aar produced by assembleRelease"
            exit 1
          fi
          echo "OK: built $AAR ($(stat -c%s "$AAR") bytes)"
          # rsac-0aa9: the packaged AAR must carry librsac.so per ABI.
          for ABI in arm64-v8a x86_64; do
            unzip -l "$AAR" | grep -q "jni/$ABI/librsac.so" || {
              echo "FAIL: $AAR is missing jni/$ABI/librsac.so"
              unzip -l "$AAR"
              exit 1
            }
          done
          echo "OK: AAR contains librsac.so for arm64-v8a and x86_64"

  # ── iOS mobile leg (rsac-48e7): backend cross-check + SwiftPM build ──
  # Same stage-1 honesty: compilation only.
  mobile-ios:
    name: iOS Mobile Leg (cross-check + SwiftPM)
    timeout-minutes: 25
    needs: [changes, lint]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-apple-ios

      - name: Cross-check the iOS backend (feat_ios)
        run: |
          cargo check --target aarch64-apple-ios --no-default-features --features feat_ios
          cargo check --target aarch64-apple-ios
          cargo check --target aarch64-apple-ios --tests --no-default-features --features feat_ios
          cargo clippy --target aarch64-apple-ios --no-default-features --features feat_ios -- -D warnings

      # rsac-7a18: the C FFI is how Flutter/C consumers reach rsac on iOS
      # (staticlib + dart:ffi).
      - name: Cross-check rsac-ffi for iOS (feat_ios)
        run: cargo check -p rsac-ffi --target aarch64-apple-ios --no-default-features --features feat_ios

      # rsac-f21c / ADR-0014 §7: cross-check the plugin's #[cfg(mobile)] path for
      # iOS (register_ios_plugin / ios_plugin_binding!). On the ios target the
      # plugin's rsac dep pulls feat_ios so with_ios_app_group is in scope.
      # [CI-VERIFY] item #2 — this leg (full Xcode on the macOS runner) is the
      # authoritative check; the dev box lacks the iphoneos SDK cc-rs needs.
      - name: Cross-check tauri-plugin-rsac for iOS (#[cfg(mobile)])
        run: cargo check -p tauri-plugin-rsac --target aarch64-apple-ios

      - name: Build the SwiftPM package for iOS (both products)
        working-directory: mobile/ios
        run: |
          # xcodebuild drives SwiftPM directly; a generic iOS destination needs
          # no simulator runtime and no signing for library products.
          xcodebuild build \
            -scheme RsacAudio \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -scheme RsacBroadcastKit \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # ── Binding crates compilation check ─────────────────────────────────
  check-bindings:
    name: Binding Crates
    timeout-minutes: 20
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Install PipeWire dev libraries
        uses: ./.github/actions/pipewire-setup
        with:
          # libclang-dev: bindgen for the binding crates.
          # libgtk-3-dev + libwebkit2gtk-4.1-dev: tauri-runtime (a non-optional
          # dep of `tauri`, pulled even with default-features=false) declares
          # gtk + webkit2gtk-sys as UNCONDITIONAL Linux deps, whose build scripts
          # probe pkg-config for gtk+-3.0/webkitgtk. Without these the
          # tauri-plugin-rsac desktop check below hard-fails on
          # gtk-sys/gdk-sys/atk-sys/javascriptcore-rs-sys/soup3-sys.
          extra-packages: libclang-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check rsac-ffi (C FFI)
        run: cargo check -p rsac-ffi

      # rsac-e93b: the 24 compose FFI functions (src/compose.rs, behind the
      # non-default `compose` feature) are invisible to the bare check above —
      # without this leg they would never be compiled anywhere in CI.
      - name: Check rsac-ffi (C FFI, compose feature)
        run: cargo check -p rsac-ffi --features compose

      # rsac-3e24: clippy the binding crates under -D warnings. The root lint job
      # only lints the workspace default member (feat_<os>), so binding-crate
      # clippy errors (e.g. manual_is_multiple_of, type_complexity) previously
      # reached CI only as a `cargo check` pass. Lint all three to the same bar.
      # rsac-e93b: rsac-ffi is linted twice — bare AND with `compose` — so the
      # compose FFI surface is held to the same -D warnings bar.
      - name: Clippy binding crates (-D warnings)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          cargo clippy -p rsac-ffi --all-targets -- -D warnings
          cargo clippy -p rsac-ffi --all-targets --features compose -- -D warnings
          cargo clippy -p rsac-napi --all-targets -- -D warnings
          cargo clippy -p rsac-python --all-targets -- -D warnings

      # rsac-f21c / ADR-0014: the Tauri v2 plugin is a workspace member with its
      # own deps (Tauri). Hold its DESKTOP target to the repo -D warnings bar
      # with an explicit leg (same pattern/rationale as rsac-3e24). The plugin's
      # `tauri` dep is `default-features = false` (no webview), which drops the
      # wry runtime — but tauri-runtime still pulls gtk + webkit2gtk-sys
      # unconditionally on Linux, so libgtk-3-dev + libwebkit2gtk-4.1-dev are
      # installed in the pipewire-setup step above (verified locally by
      # cross-target `cargo check`; the one-line dep tweak alone is NOT enough).
      - name: Check + clippy tauri-plugin-rsac (desktop)
        run: |
          cargo check -p tauri-plugin-rsac
          cargo clippy -p tauri-plugin-rsac --all-targets -- -D warnings

      # rsac-1413 / BP-5: the curated include/rsac.h (which rsac-go links against)
      # must never silently drift from the cbindgen-generated twin. build.rs runs
      # cbindgen on every build and writes include/rsac_generated.h. Here we build
      # rsac-ffi to (re)generate that twin, then diff its SYMBOL SET — every
      # typedef/struct/enum type name plus every exported `rsac_*` function name —
      # against the curated header. We compare the symbol SET, not the byte stream,
      # so the headers may legitimately differ in layout, doc comments, and the
      # tagged-vs-anonymous typedef style (`typedef enum X {…} X;` vs
      # `typedef enum {…} X;`) — only a genuinely added / renamed / removed symbol
      # fails the job. A failure means: regenerate rsac_generated.h, then update the
      # curated rsac.h (NEVER point cbindgen --output at rsac.h).
      #
      # rsac-e93b: cbindgen.toml's [defines] mapping ("feature = compose" →
      # RSAC_FEATURE_COMPOSE) promises header generation is DETERMINISTIC
      # regardless of enabled features — compose items are always emitted,
      # wrapped in `#if defined(RSAC_FEATURE_COMPOSE)`. We now build rsac-ffi
      # BOTH bare and with --features compose and byte-diff the two generated
      # headers, so a build.rs/cbindgen change that breaks that determinism
      # (e.g. feature-conditional generation) fails here instead of shipping a
      # header whose content depends on which build produced it.
      - name: Header drift check (curated rsac.h vs generated, feature-deterministic)
        shell: bash
        run: |
          set -euo pipefail
          # build.rs runs cbindgen and writes include/rsac_generated.h.
          # Build bare first, snapshot the generated header…
          cargo build -p rsac-ffi
          cp bindings/rsac-ffi/include/rsac_generated.h rsac_generated.bare.h
          # …then rebuild with the compose feature (this also re-runs build.rs —
          # the feature set is part of the build-script fingerprint) and demand
          # the generated header is byte-identical.
          cargo build -p rsac-ffi --features compose
          if ! diff -u rsac_generated.bare.h bindings/rsac-ffi/include/rsac_generated.h; then
            echo "::error::include/rsac_generated.h differs between the bare and --features compose builds."
            echo "::error::Header generation must be feature-deterministic (see cbindgen.toml [defines]) — compose items belong behind #if defined(RSAC_FEATURE_COMPOSE), not behind conditional generation."
            exit 1
          fi
          echo "OK: rsac_generated.h is byte-identical with and without --features compose."
          cd bindings/rsac-ffi/include

          CURATED="rsac.h"
          GENERATED="rsac_generated.h"
          for h in "$CURATED" "$GENERATED"; do
            [ -f "$h" ] || { echo "::error::expected header $h not found"; exit 1; }
          done

          # Extract the canonical symbol set from a C header:
          #   • value typedefs   ->  trailing "} NAME;"  (enum/struct, either style)
          #   • opaque typedefs  ->  "typedef struct X NAME;"
          #   • fn-ptr typedefs  ->  "(*NAME)("
          #   • exported fns     ->  "rsac_<name>("
          # This is style-tolerant: a tagged `typedef enum X {…} X;` and an
          # anonymous `typedef enum {…} X;` both reduce to the name `X`.
          symbols() {
            local f="$1"
            {
              grep -oE '^\}[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*;' "$f" \
                | sed -E 's/^\}[[:space:]]*//; s/[[:space:]]*;//'
              grep -oE 'typedef[[:space:]]+struct[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*;' "$f" \
                | sed -E 's/.*[[:space:]]([A-Za-z_][A-Za-z0-9_]*)[[:space:]]*;/\1/'
              grep -oE '\(\*[A-Za-z_][A-Za-z0-9_]*\)' "$f" | sed -E 's/\(\*//; s/\)//'
              grep -oE '\brsac_[A-Za-z0-9_]*\(' "$f" | sed -E 's/\($//'
            } | sort -u
          }

          symbols "$CURATED" > curated-symbols.txt
          symbols "$GENERATED" > generated-symbols.txt

          echo "curated  symbols: $(wc -l < curated-symbols.txt)"
          echo "generated symbols: $(wc -l < generated-symbols.txt)"

          # Guard against an extractor that silently matched nothing.
          if [ ! -s curated-symbols.txt ] || [ ! -s generated-symbols.txt ]; then
            echo "::error::symbol extraction yielded an empty set — the header format may have changed; fix the extractor in ci.yml"
            exit 1
          fi

          if ! diff -u curated-symbols.txt generated-symbols.txt; then
            echo "::error::cbindgen-generated header symbol set has DRIFTED from the curated include/rsac.h."
            echo "::error::'-' lines are only in curated rsac.h; '+' lines are only in generated rsac_generated.h."
            echo "::error::Reconcile: regenerate rsac_generated.h, then update the curated rsac.h to match (NEVER cbindgen --output rsac.h)."
            exit 1
          fi
          echo "OK: curated rsac.h and generated rsac_generated.h share an identical symbol set ($(wc -l < curated-symbols.txt) symbols)."

      - name: Check rsac-napi (Node.js/TypeScript)
        run: cargo check -p rsac-napi

      - name: Check rsac-python (Python/PyO3)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: cargo check -p rsac-python

      # ── Runtime smoke tests (rsac-e1f7) ────────────────────────────────
      # cargo check alone lets PyO3/napi signature or panic regressions ship
      # silently. Build each binding for real, load it in its runtime, and
      # exercise the device-independent surface (capabilities, target
      # grammar); device enumeration is headless-tolerant inside the tests.
      - name: Python binding smoke (maturin develop + import test)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          python3 -m venv .venv-smoke
          . .venv-smoke/bin/activate
          pip install --quiet maturin
          maturin develop -m bindings/rsac-python/Cargo.toml
          python bindings/rsac-python/tests/smoke.py

      # One cp39-abi3 wheel must load on the abi3 floor (3.9) AND the newest
      # supported CPython (3.13). `maturin develop` above only proves the
      # runner's own interpreter, and release-pypi.yml's equivalent smoke runs
      # at tag time — too late to catch a PyO3 bump that breaks either end.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: |
            3.9
            3.13

      # `--compatibility linux` skips the manylinux audit: this wheel links the
      # runner's libpipewire and is only ever installed on this runner.
      - name: Python abi3 wheel smoke (CPython 3.9 + 3.13)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          . .venv-smoke/bin/activate
          maturin build --compatibility linux \
            -m bindings/rsac-python/Cargo.toml --out target/abi3-smoke/dist
          deactivate
          WHEEL="$(ls target/abi3-smoke/dist/*.whl | head -1)"
          echo "abi3 wheel: ${WHEEL}"
          case "${WHEEL}" in
            *-abi3-*) ;;
            *) echo "::error::expected a cp39-abi3 wheel, got ${WHEEL}"; exit 1 ;;
          esac
          for PYBIN in python3.9 python3.13; do
            echo "=== smoke on $("$PYBIN" --version) ==="
            "$PYBIN" -m venv "target/abi3-smoke/venv-${PYBIN}"
            "target/abi3-smoke/venv-${PYBIN}/bin/python" -m pip install --quiet "${WHEEL}"
            "target/abi3-smoke/venv-${PYBIN}/bin/python" bindings/rsac-python/tests/smoke.py
          done

      - name: Set up Node for the napi smoke test
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      # rsac-e652: Bun is the single package manager for rsac-napi (matches
      # release-npm.yml). Pin the exact same version everywhere it's set up
      # so lockfile-resolution behavior can't drift between CI legs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions

      # --frozen-lockfile, no fallback: a stale bun.lock (drifted from
      # package.json) FAILS loudly here instead of at release time
      # (rsac-e652). The explicit `test -f` guard is load-bearing: bun
      # install --frozen-lockfile silently REGENERATES a missing lockfile
      # instead of failing (verified locally, bun 1.3.14), so without this
      # guard a deleted bun.lock would pass CI silently.
      - name: Node binding smoke (napi build + node --test)
        working-directory: bindings/rsac-napi
        run: |
          test -f bun.lock || { echo "::error::bindings/rsac-napi/bun.lock is missing — commit a lockfile (bun install)."; exit 1; }
          bun install --frozen-lockfile
          bun run build
          bun run test

  # ── Go bindings: build the FFI staticlib + run device-free tests ─────
  # rsac-go links librsac_ffi.a (built by bindings/rsac-go/Makefile) via cgo.
  # This matrix builds that staticlib natively on each platform and runs
  # `make test-pure` (the no-audio-device logic tests), so the cgo link +
  # the Go wrappers stay green across linux/windows/macos. Windows uses the
  # *-pc-windows-gnu toolchain because cgo links through MinGW gcc, which
  # consumes the GNU-archive .a (an MSVC .lib would not link). (rsac-9728)
  go-bindings:
    name: Go Bindings (${{ matrix.os }})
    timeout-minutes: 25
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-4vcpu-windows-2025
          - blacksmith-6vcpu-macos-15
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      # go.mod, not .tool-versions: this setup-go pin (v5.1.0) reads the whole
      # .tool-versions file as one version string (support arrived in v6.1.0).
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version-file: bindings/rsac-go/go.mod

      - name: Install PipeWire dev libraries (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/pipewire-setup
        with:
          extra-packages: libclang-dev

      # cgo links through MinGW gcc on Windows, which needs the GNU .a — so the
      # FFI crate must be built for the *-pc-windows-gnu target. Add it here.
      - name: Add windows-gnu Rust target (Windows)
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      # Build the FFI staticlib + run the Go-only (device-free) logic tests.
      # `make test-pure` builds rsac-ffi (release) and runs the no-device test
      # subset; the cgo link exercises every new FFI symbol.
      - name: Build FFI staticlib + run Go device-free tests
        working-directory: bindings/rsac-go
        run: make test-pure

      - name: go vet
        working-directory: bindings/rsac-go
        run: |
          CGO_ENABLED=1 \
          CGO_LDFLAGS="-L$(pwd)/lib -lrsac_ffi" \
          go vet ./...

  # ── Go ARM64 cross-compile check (staticlib only) ────────────────────
  # The pipewire-debian PPA publishes no arm64 binaries, so a full aarch64
  # link+test is not possible here (matching cross-compile-linux-arm64).
  # We compile-check the FFI staticlib for aarch64 so the Go-linked artifact
  # does not bit-rot on ARM; full ARM Go tests run on native ARM elsewhere.
  go-bindings-arm64-check:
    name: Go Bindings ARM64 Staticlib Check
    timeout-minutes: 20
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          targets: aarch64-unknown-linux-gnu

      # Combined cross-gcc + host PipeWire install: kept inline (not the
      # pipewire-setup composite) because it also installs the aarch64 cross
      # toolchain the composite does not cover, and shares a single apt-get
      # update across both package sets.
      - name: Install cross toolchain + host PipeWire dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo add-apt-repository ppa:pipewire-debian/pipewire-upstream -y
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev pkg-config libclang-dev

      - name: Cross-compile rsac-ffi staticlib (aarch64, compile-only)
        run: |
          # Compile-only check (no arm64 PipeWire link libs in the PPA). The
          # build's REAL exit code is authoritative: exit 0 passes, and a
          # non-zero exit is tolerated ONLY for the one known-acceptable mode
          # (the pipewire/libspa -sys build scripts failing pkg-config
          # discovery of the missing aarch64 system libraries). Any other
          # failure — rustc `error[` / `error:` diagnostics included — fails
          # the job. CARGO_TERM_COLOR is forced off so the greps see plain
          # text (the workflow-level `always` would embed ANSI codes).
          set -o pipefail
          STATUS=0
          CARGO_TERM_COLOR=never cargo build -p rsac-ffi --release \
            --target aarch64-unknown-linux-gnu 2>&1 | tee go-arm64.log || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo "OK: aarch64 rsac-ffi staticlib built cleanly"
            exit 0
          fi
          # Fail on any error diagnostic that is NOT the tolerated
          # pipewire/libspa build-script failure.
          UNEXPECTED="$(grep -E '^error(\[|:)' go-arm64.log \
            | grep -vE 'failed to run custom build command for `(pipewire|libspa)' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo "FAIL: rsac-ffi aarch64 build exited ${STATUS} with unexpected errors:"
            echo "$UNEXPECTED"
            exit 1
          fi
          # Confirm the root cause really is pkg-config discovery of the
          # missing aarch64 PipeWire libs, not some other build-script issue.
          if ! grep -qiE 'pkg-config|library .* was not found|\.pc' go-arm64.log; then
            echo "FAIL: rsac-ffi aarch64 build exited ${STATUS} without the expected pkg-config/libpipewire diagnostic — not the tolerated missing-arm64-libs mode"
            exit 1
          fi
          echo "TOLERATED: aarch64 PipeWire system libraries unavailable (pkg-config failure in the pipewire/libspa -sys build scripts); no rustc compilation errors"

  # ── Feature-combo compile + doctests (Linux) ────────────────────────
  # The async-stream / sink-wav / test-utils features are not exercised by
  # any other job (they're off in the default --features feat_<platform>
  # runs), so they can silently bit-rot. This job compiles them together and
  # runs the doctests, which are otherwise never executed in CI.
  feature-combo-doctests:
    name: Feature Combo + Doctests (Linux)
    timeout-minutes: 20
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Install PipeWire dev libraries
        uses: ./.github/actions/pipewire-setup

      - name: Check feature combination (async-stream + sink-wav + test-utils + compose)
        run: cargo check --no-default-features --features feat_linux,async-stream,sink-wav,test-utils,compose

      # rsac-3e24: clippy the optional features under -D warnings. The root lint
      # job lints only feat_<os>, so a lint that fires solely under an optional
      # feature never gated CI. Lint the full optional-feature set here.
      - name: Clippy optional features (-D warnings)
        run: |
          cargo clippy --all-targets --no-default-features --features feat_linux,async-stream,sink-wav,test-utils,compose -- -D warnings

      # rsac-86c7: async-stream unit tests are clippy'd above but were never
      # EXECUTED by any `--lib` leg. Run them here — this job already isolates
      # the optional-feature build.
      - name: Run unit tests (async-stream)
        run: |
          cargo test --lib --no-default-features --features feat_linux,async-stream,sink-wav,test-utils,compose

      - name: Run doctests
        # Build doctests with the same feature set so doc examples that touch
        # async-stream / sink-wav / compose APIs are exercised too — the compose
        # module docs carry a `no_run` doctest that must COMPILE here.
        run: cargo test --doc --no-default-features --features feat_linux,async-stream,sink-wav,test-utils,compose

  # ── Feature powerset (cargo-hack, Linux) ───────────────────────────
  # The hand-picked feature-combo-doctests job above checks ONE combination;
  # this checks the POWERSET: async-stream / sink-wav / test-utils /
  # tracing / compose / cli — and any future features — get
  # covered combinatorially, so a bad pairwise interaction (a cfg that only
  # compiles with one feature on and another off) can't slip through.
  # feat_windows / feat_macos are excluded because their platform deps cannot
  # compile on a Linux runner; feat_linux stays in the powerset, hence the
  # PipeWire headers below.
  feature-powerset:
    name: Feature Powerset (cargo-hack)
    timeout-minutes: 30
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Install PipeWire dev libraries
        uses: ./.github/actions/pipewire-setup

      - name: Install cargo-hack
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2
        with:
          tool: cargo-hack

      # rsac-0a1f: a FULL powerset over the non-excluded feature set is
      # exponential — far past this job's 30-min budget. --depth 2 bounds it
      # to every single feature + every PAIR, which is exactly the
      # pairwise-interaction guarantee this job exists to provide (cargo-hack
      # prints the actual combo count at runtime).
      - name: Check feature powerset
        run: cargo hack check --feature-powerset --depth 2 --no-dev-deps --exclude-features feat_windows,feat_macos --keep-going

  # ── Coverage (cargo-llvm-cov, Linux, ADVISORY) ──────────────────────
  # continue-on-error at the JOB level: coverage on device-gated audio code
  # is inherently noisy (backend hot paths only execute against real audio
  # hardware, which headless runners lack), so the number is TREND DATA for
  # maintainers, not a merge gate. This job must never block CI and is
  # deliberately absent from any required-checks logic. Uploads lcov.info as
  # an artifact always; forwards to Codecov only when a CODECOV_TOKEN secret
  # is configured (env-emptiness probe — secrets can't be read in `if:`).
  coverage:
    name: Coverage (cargo-llvm-cov, advisory)
    timeout-minutes: 30
    needs: lint
    # Advisory trend data with no merge-decision value: the instrumented
    # rebuild runs on tags and on `full: true` dispatches only.
    if: github.event_name != 'workflow_dispatch' || inputs.full
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          # Distinct prefix: llvm-cov instruments with -C instrument-coverage,
          # so its artifacts must not poison the plain 1.95 caches.
          cache-prefix-key: v0-rust-llvm-cov

      - name: Install PipeWire dev libraries
        uses: ./.github/actions/pipewire-setup

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2
        with:
          tool: cargo-llvm-cov

      # Same feature set as the Linux lib suite plus the non-platform optional
      # features, so the sink/test-utils/compose code is measured too.
      - name: Run cargo-llvm-cov (lib, lcov output)
        run: cargo llvm-cov --lib --no-default-features --features feat_linux,compose,sink-wav,test-utils --lcov --output-path lcov.info

      - name: Upload lcov.info artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

      # Codecov upload is opt-in: probe the secret via env emptiness (secrets
      # are not readable in `if:` expressions on every context) and gate the
      # upload step on the resulting output flag. No token → artifact-only.
      - name: Detect Codecov token
        id: codecov
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CODECOV_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN not configured — skipping Codecov upload (lcov.info artifact still uploaded)."
          fi

      - name: Upload to Codecov
        if: steps.codecov.outputs.available == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Advisory job: never fail on an upload hiccup.
          fail_ci_if_error: false

  # ── MSRV check (Rust 1.88, Linux + Windows) ─────────────────────────
  # Guards rust-version = "1.88" (Cargo.toml:9) from rotting under the pinned
  # 1.95 toolchain. Runs on BOTH Linux and Windows (free GH windows-2025) so
  # Windows-only dependencies (e.g. sysinfo 0.38.4, which raised the real MSRV
  # to 1.88 while the former Linux-only check stayed green at 1.87) can never
  # silently violate the declared MSRV again.
  msrv:
    name: MSRV Check (Rust 1.88, ${{ matrix.os }})
    timeout-minutes: 25
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - os: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      # Same SHA-pinned action commit as the 1.95.0 pins above; the
      # `toolchain` input overrides the ref-derived version with the MSRV.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # action pin as above; toolchain input = 1.88.0
        with:
          toolchain: "1.88.0"
      # Distinct cache prefix so MSRV (1.88) artifacts never poison the 1.95
      # caches shared by every other job.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: v0-rust-msrv-1-88-${{ matrix.os }}

      - name: Install PipeWire dev libraries
        if: matrix.os == 'linux'
        uses: ./.github/actions/pipewire-setup

      # `--locked` on both steps: the MSRV claim is about the COMMITTED
      # lockfile, so a drifted Cargo.lock must fail instead of silently
      # re-resolving to a dependency with a newer rust-version.
      - name: Cargo check (MSRV)
        run: cargo check --locked --all-features --all-targets

      # rsac-napi and tauri-plugin-rsac declare the same 1.88 floor and
      # rsac-ffi ships with them. Windows only: tauri's Linux build needs the
      # gtk/webkit dev libraries this job does not install.
      - name: Cargo check binding crates (MSRV)
        if: matrix.os == 'windows'
        run: cargo check --locked -p rsac-ffi -p rsac-napi -p tauri-plugin-rsac

  # ── docs.rs render gate (cargo doc) ─────────────────────────────────
  # rsac L14(b): Cargo.toml carries a [package.metadata.docs.rs] block
  # (all-features = true, rustdoc-args = ["--cfg", "docsrs"]) but nothing in
  # CI exercised it, so a broken intra-doc link or a `#[cfg_attr(docsrs, …)]`
  # mistake would only surface as a RED docs.rs build *after* publish. This job
  # reproduces the docs.rs invocation as closely as a single Linux runner can:
  #   • --all-features matches docs.rs `all-features = true`.
  #   • RUSTDOCFLAGS="--cfg docsrs -D warnings" turns broken-doc-link / bad-doc
  #     warnings into a hard failure and enables the `docsrs` cfg the metadata
  #     block sets, so `#[cfg_attr(docsrs, doc(...))]` annotations are exercised.
  # rsac-0fb1: the macOS/Windows backends are gated `all(target_os = "X",
  # feature = "feat_X")`, so a single Linux-only leg left them cfg-disabled
  # even with every feature on — the `#[cfg_attr(docsrs, ...)]` blocks on
  # audio::macos::* / audio::windows::* were never rendered or lint-checked
  # anywhere. Mirror the `lint` job's 3-OS matrix (above) so each OS's
  # cfg-gated docs get exercised on the runner where they're actually enabled.
  docs:
    name: Docs (cargo doc, docs.rs config, ${{ matrix.os }})
    timeout-minutes: 20
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            feature: feat_linux
            os: linux
          - runner: blacksmith-4vcpu-windows-2025
            feature: feat_windows
            os: windows
          - runner: blacksmith-6vcpu-macos-15
            feature: feat_macos
            os: macos
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Install PipeWire dev libraries
        if: matrix.os == 'linux'
        uses: ./.github/actions/pipewire-setup

      - name: cargo doc (no-deps, all-features, docs.rs flags)
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc --no-deps --all-features

  # ── Supply-chain audit (cargo-deny) ─────────────────────────────────
  # cargo-deny is chosen over cargo-audit because it covers advisories AND
  # license compliance, banned/duplicate crates, and source registries in a
  # single declarative config (deny.toml at the repo root). The initial
  # deny.toml is conservative: hard-fail on security advisories + disallowed
  # licenses, warn-only on duplicate versions so a benign version skew doesn't
  # break CI on day one.
  # ── Module-DAG reverse-edge guard (DAG-004) ─────────────────────────
  # Enforce the layering invariant core -> bridge -> audio -> api -> lib by
  # failing on any NEW reverse import edge (e.g. core importing crate::audio).
  # The one known, tracked exception (core/introspection.rs -> crate::audio for
  # cross-platform enumeration) is allowlisted inside the script. No toolchain
  # needed — it is a pure ripgrep/grep source scan.
  module-dag:
    name: Module DAG (reverse-edge guard)
    timeout-minutes: 5
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Check for reverse module-DAG edges
        run: bash scripts/check-module-dag.sh
      # CI-5 regression guard: prove the scanner still FLAGS a deliberate
      # core->audio reverse edge (catches the guard silently degrading to a
      # false-negative, e.g. a pattern that misses a bare `use crate::audio;`).
      - name: Self-test the module-DAG guard
        run: bash scripts/check-module-dag.sh --self-test

  # ── Secret scan (betterleaks) ───────────────────────────────────────
  # Independent of `changes`/`lint` on purpose: a docs-only branch (where the
  # compile matrix is skipped) is exactly where a pasted token lands, so it
  # must always be scanned. Every run scans the full history (seconds on this
  # repo). Rules and allowlist: .betterleaks.toml. The scanner
  # version is pinned once, in mise.toml (jdx/mise-action installs just
  # betterleaks). --redact keeps matched values out of the public logs; never
  # pass -v/--validation (sends findings to provider APIs).
  secrets:
    name: Secret Scan (betterleaks)
    timeout-minutes: 10
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: betterleaks
          cache: false
          github_token: ${{ github.token }}

      - name: Scan (full history)
        run: |
          set -euo pipefail
          betterleaks version
          betterleaks config check .betterleaks.toml
          betterleaks git . --config .betterleaks.toml --redact --no-banner

  supply-chain:
    name: Supply Chain (cargo-deny)
    timeout-minutes: 20
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup

      - name: Install cargo-deny
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --workspace --all-features check advisories bans licenses sources

  # ── Version lockstep guard (rsac + 4 bindings) ──────────────────────
  # Enforces the versioning/ABI contract documented in
  # docs/RELEASE_PROCESS.md §"Versioning & ABI contract":
  # rsac and every publishable binding manifest bump in lockstep on a
  # semver tag. This job extracts the [package].version of the root crate
  # and the four binding manifests (rsac-ffi/rsac-napi/rsac-python +
  # rsac-napi/package.json + rsac-python/pyproject.toml) and asserts they
  # all agree.
  #
  #   • On a `vX.Y.Z` tag push it ALSO asserts every version equals the
  #     tag (minus the leading `v`) and HARD-FAILS on any divergence — a
  #     mismatched manifest must never reach a registry. This is the
  #     "CI check that fails if versions diverge from the release tag"
  #     required by the contract.
  #   • On ordinary pushes / PRs it only WARNS (via ::warning::) so a
  #     deliberate mid-cycle skew (e.g. a binding lagging behind the root
  #     crate between releases) does not block day-to-day CI. The hard
  #     gate runs at tag time, which is the point of no return.
  version-lockstep:
    name: Version Lockstep (rsac + bindings + tauri-plugin)
    timeout-minutes: 5
    needs: lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # The whole extraction + comparison lives in
      # scripts/check-version-lockstep.sh (the single source of truth shared
      # with the three registry publish workflows — no logic is duplicated in
      # YAML anymore). On a `vX.Y.Z` tag push we pass `--expect <tag-version>`,
      # which HARD-FAILS on any manifest that does not equal the tag — the
      # point of no return. On a manual dispatch we pass `--warn-only`, so a
      # deliberate mid-cycle skew (a binding lagging the root crate between
      # releases) only warns and does not block day-to-day CI. An
      # unextractable version is a hard failure regardless (the script
      # fail-closes on it).
      - name: Check rsac + binding versions are in lockstep
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "release tag detected: v${TAG_VERSION} — enforcing lockstep + tag match"
            bash scripts/check-version-lockstep.sh --expect "${TAG_VERSION}"
          else
            bash scripts/check-version-lockstep.sh --warn-only
          fi

  # ── Semver gate for release branches (interim home) ─────────────────
  # cargo-semver-checks (the public-API compatibility gate) normally lives in
  # release.yml's tag-triggered publish pipeline — but release.yml is currently
  # disabled_manually (seed rsac-aaea: missing crates.io/npm/PyPI publish
  # credentials). While it's disabled this job is the only path that runs the
  # semver gate before a tag, so a breaking API change cannot ship into a
  # release undetected.
  #
  # Scoping is deliberate. It runs on a manual dispatch of the release bump
  # branch (release-prepare.yml always names it release/vX.Y.Z) or when the
  # dispatcher sets `semver: true`. It must NOT run on ordinary feature
  # branches, nor on release-stacking integration/layer branches
  # (release/X.Y.Z, no `v`) that intentionally bundle breaking changes before
  # the single version bump (docs/reviews/rsac-backlog-blueprints-2026-05-30.md
  # warned a naively-scoped gate would false-positive-block exactly those).
  # Pre-tag feedback is strictly earlier than tag time, so KEEP this job even
  # after release.yml is re-enabled.
  #
  # Baseline resolution mirrors release.yml's `git describe ... HEAD^`: on the
  # bump branch, HEAD^ is master's tip before the bump commit, and the previous
  # stable v*.*.* tag is reachable from there.
  semver-checks-release:
    name: Semver Gate (release branch)
    if: "github.event_name == 'workflow_dispatch' && (inputs.semver || startsWith(github.ref_name, 'release/v'))"
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          # Full history + tags: the baseline is resolved from the previous
          # v*.*.* tag, which the default shallow clone cannot see.
          fetch-depth: 0
      - uses: ./.github/actions/rust-setup

      # cargo-semver-checks builds the crate, so build.rs needs libpipewire —
      # same dev-headers install release.yml's semver-checks job uses.
      - name: Install PipeWire dev libraries
        uses: ./.github/actions/pipewire-setup

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@0fd46367812ee04360509b4169d9f659d6892bb2 # v2
        with:
          tool: cargo-semver-checks

      - name: Resolve baseline (previous stable release tag)
        id: baseline
        shell: bash
        run: |
          # Mirrors release.yml's baseline resolution: newest stable v*.*.* tag
          # reachable from HEAD^ (pre-release shapes v*-* excluded). No previous
          # tag (first release) => warn + skip rather than fail, since there is
          # nothing to diff against.
          if PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude 'v*-*' HEAD^ 2>/dev/null)"; then
            echo "baseline release tag: ${PREV_TAG}"
            echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no previous stable v*.*.* tag found — skipping cargo-semver-checks (first release has no baseline)"
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
          fi

      # Scoped to the root crate: this mirrors release.yml, which publishes
      # ONLY `rsac` (the bindings release via their own workflows).
      - name: cargo semver-checks (vs previous release)
        if: steps.baseline.outputs.prev_tag != ''
        env:
          PREV_TAG: ${{ steps.baseline.outputs.prev_tag }}
        run: cargo semver-checks check-release -p rsac --baseline-rev "$PREV_TAG"
