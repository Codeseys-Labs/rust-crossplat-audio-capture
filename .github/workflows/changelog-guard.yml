# CHANGELOG process guard (rsac-7437).
#
# Every PR touching src/ or bindings/ must record its change in
# CHANGELOG.md's [Unreleased] section, or carry the changelog-not-needed
# label for genuinely internal changes (test-only, CI-only, docs-only diffs
# that also happen to touch src/ comments, etc.). Root cause: 0.4.1's
# release notes shipped incomplete because PRs #41-#49 fixed code but never
# touched CHANGELOG.md (caught only by a manual post-release audit).
#
# Lives in its own workflow (extracted from ci.yml) so that `labeled` /
# `unlabeled` — needed for the changelog-not-needed escape hatch to take
# effect the moment the label is applied — re-run ONLY this 5-minute job.
# In ci.yml those triggers re-ran the entire compile matrix on every label
# toggle. A manual "Re-run" replays the original event payload (labels
# captured at trigger time), so the label events are what make it work.
#
# Independent of ci.yml's `changes`/`lint` (must not skip silently). Applies
# to ALL PR base branches including release/** — release-stacking layer PRs
# use the changelog-not-needed label per-layer (see AGENTS.md §6) rather than
# a blanket base-branch exemption the guard can't audit.

name: CHANGELOG Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, master, 'release/**']

# Least-privilege token: this workflow only reads.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a label toggle right after a push
# must not leave a stale run racing the fresh one).
concurrency:
  group: changelog-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog-guard:
    name: CHANGELOG Guard
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check CHANGELOG.md [Unreleased] touched (or label escape hatch)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if echo "$PR_LABELS_JSON" | grep -q '"changelog-not-needed"'; then
            echo "OK: PR carries the changelog-not-needed label — skipping."
            exit 0
          fi

          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          CHANGED="$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")"
          printf 'changed files:\n%s\n' "$CHANGED"

          TOUCHES_SRC="$(printf '%s\n' "$CHANGED" | grep -E '^(src/|bindings/)' || true)"
          if [ -z "$TOUCHES_SRC" ]; then
            echo "OK: no src/ or bindings/ changes — CHANGELOG not required."
            exit 0
          fi

          if printf '%s\n' "$CHANGED" | grep -q '^CHANGELOG\.md$'; then
            # Confirm the [Unreleased] section itself changed, not just some
            # other part of the file (e.g. a stray whitespace fix in an older
            # release block). Extract the section body — everything between the
            # `## [Unreleased]` header and the next `## [` header — at both the
            # merge-base and the head, and compare. Anchoring on the extracted
            # section (not on `git diff` output, whose lines carry +/-/space
            # prefixes) is the only reliable approach: an entry added under a
            # subsection like `### Fixed` puts the diff hunk several lines below
            # the `## [Unreleased]` header, so the header never appears in the
            # diff context and a diff-line-anchored awk misses it entirely.
            # `|| true` keeps `set -euo pipefail` from aborting the step when
            # CHANGELOG.md does not exist at the merge-base (e.g. a PR that adds
            # the file for the first time): `git show` exits non-zero there, and
            # under pipefail that would otherwise hard-fail the whole job.
            base_unreleased="$( { git show "$MERGE_BASE:CHANGELOG.md" 2>/dev/null || true; } \
              | awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f')"
            head_unreleased="$( { git show "$HEAD_SHA:CHANGELOG.md" 2>/dev/null || true; } \
              | awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f')"
            if [ "$base_unreleased" != "$head_unreleased" ]; then
              echo "OK: CHANGELOG.md [Unreleased] section was modified."
              exit 0
            fi
          fi

          echo "::error::This PR touches src/ or bindings/ but does not update CHANGELOG.md's [Unreleased] section."
          echo "::error::Add an entry under [Unreleased], or apply the 'changelog-not-needed' label if this change has no user-facing effect (test-only, internal refactor, CI-only)."
          exit 1
